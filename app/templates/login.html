{% extends "base.html" %}

{% block title %}Sign In | Personal Fitness Tracker{% endblock %}

{% block content %}
<div class="glass-card form-wrapper">
  <h2>Welcome Back</h2>
  <p class="subtitle">Enter your credentials to access your fitness dashboard</p>

  <div id="form-alert" class="alert-message"></div>

  <form id="login-form">
    <div class="form-group">
      <label for="username">Username or Email</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="alex_athlete" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
  </form>

  <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
    Don't have an account yet? <a href="/register" style="color: var(--accent-cyan); font-weight: 600;">Create Account</a>
  </div>
</div>
{% endblock %}
